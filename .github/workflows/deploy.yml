name: Build and Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 构建 Docker 镜像
      - name: Build Docker image
        run: docker build -t joyk8-app:latest .

      # 3. 保存为 tar 文件
      - name: Save image to tar
        run: |
          mkdir -p /tmp/joyk8-build
          docker save -o /tmp/joyk8-build/joyk8-app.tar joyk8-app:latest
          ls -lh /tmp/joyk8-build/joyk8-app.tar

      # 4. 通过 SCP 传到服务器
      - name: Copy to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "/tmp/joyk8-build/joyk8-app.tar"
          target: "/data/joyk8/tmp/"

      # 5. 在服务器上执行部署脚本
      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /data/joyk8
            bash scripts/deploy.sh
