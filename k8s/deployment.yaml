apiVersion: apps/v1
kind: Deployment
metadata:
  name: joyk8-app
  labels:
    app: joyk8
spec:
  replicas: 3
  selector:
    matchLabels:
      app: joyk8
  template:
    metadata:
      labels:
        app: joyk8
    spec:
      containers:
        - name: joyk8
          image: joyk8-app:2.1
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          
          # === 【新增】从 ConfigMap 注入环境变量 ===
          envFrom:
            - configMapRef:
                name: joyk8-config
          
          # === 【新增】健康探针（生产环境必备！）===
          # startupProbe：启动探针（应用启动慢时给足时间）
          startupProbe:
            httpGet:
              path: /ready           # 访问应用的 /ready 接口
              port: 8000
            failureThreshold: 30    # 最多失败 30 次（30×2s = 60 秒启动时间）
            periodSeconds: 2        # 每 2 秒检查一次
          
          # livenessProbe：存活探针（应用死了就重启）
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10  # 启动后等 10 秒再开始检查（给应用时间启动）
            periodSeconds: 10        # 每 10 秒检查一次
            timeoutSeconds: 3        # 每次超时 3 秒
            failureThreshold: 3      # 连续 3 次失败就重启 Pod
          
          # readinessProbe：就绪探针（应用没准备好就不接流量）
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 5         # 每 5 秒检查
            failureThreshold: 3      # 连续 3 次失败就从 Service 中移除
          
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
